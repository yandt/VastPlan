schemaVersion: 1
mode: development
# Releasing over an active Generation may provide its verified Plugin Inventory
# here. In production the release controller injects the same baseline through
# its trusted active-generation port rather than accepting a caller path.
# baselineInventory: .vastplan/release/active-plugin-inventory.json
plugins:
  - id: cn.vastplan.foundation.frontend.workflow.workbench
    # implementation: only package bytes change; consumers are reused.
    # additive: new optional public surface; consumers opt in independently.
    # breaking: direct consumers must be included in this same release spec.
    change: implementation
    frontendTarget: operations
    frontendScope: platform-profile-plugin
